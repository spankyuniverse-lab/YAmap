# Пример конфиг-файла для yandex_parser.py (Казахстан, yandex.kz)
# Использование: python yandex_parser.py --config config.yaml

# Домен Яндекс.Карт: kz (Казахстан, по умолчанию), ru, com, by, uz, tr
tld: "kz"

# Город для парсинга по категориям (для KZ пинит гео-вьюпорт автоматически)
city: "Алматы"

# Категории (группы или конкретные)
categories:
  - еда
  - авто
  - здоровье

# Центр карты и зум для гео-привязки (опционально; переопределяет город).
# ll = "долгота,широта" (долгота первая, как в GeoJSON).
# ll: "76.8897,43.2389"   # Алматы
# z: 12                    # 11-13 город, 10 пригороды, 14 центр

# Максимум организаций на запрос/категорию
max_results: 200

# Пауза между скроллами (секунды)
scroll_pause: 1.2

# Файл результатов (.xlsx, .csv, .json)
output: "results.xlsx"

# Показывать браузер
headless: true

# Открывать карточки для телефона/сайта (медленно)
detail: false

# Режим перехвата API — надёжнее и снимает ВСЕ поля (рекомендуется)
api_intercept: true

# Прокси (для обхода анти-фрода лучше казахстанские резидентские/мобильные)
# proxy: "http://user:pass@host:port"
# proxy_file: "proxies.txt"
