name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Syntax check
        run: |
          python -m py_compile yandex_parser/__init__.py
          python -m py_compile yandex_parser/models.py
          python -m py_compile yandex_parser/config.py
          python -m py_compile yandex_parser/export.py
          python -m py_compile yandex_parser/core.py
          python -m py_compile yandex_parser/cli.py

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -x
